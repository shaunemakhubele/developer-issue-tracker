<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Issue Form | Developer Issue Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #202938;
        }
        header {
            background: #172033;
            color: white;
            padding: 22px 6%;
        }
        header a { color: white; text-decoration: none; font-weight: bold; }
        main { max-width: 760px; margin: 35px auto; padding: 0 20px; }
        h1 { margin: 0 0 8px; font-size: 26px; }
        .muted { color: #667085; margin-bottom: 25px; }
        .panel {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 26px;
        }
        .field { margin-bottom: 20px; }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
            background: white;
        }
        textarea { min-height: 140px; resize: vertical; }
        input:focus, textarea:focus, select:focus {
            outline: 2px solid #a5b4fc;
            border-color: #4f46e5;
        }
        .error { color: #b91c1c; font-size: 13px; margin-top: 6px; }
        .help { color: #667085; font-size: 13px; margin-top: 6px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .actions { display: flex; gap: 12px; margin-top: 25px; }
        .button {
            display: inline-block;
            padding: 12px 17px;
            border: 0;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .primary { background: #4f46e5; color: white; }
        .secondary { background: #e8eaf0; color: #202938; }
        footer { text-align: center; padding: 25px; color: #667085; font-size: 13px; }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; gap: 0; }
            .panel { padding: 20px; }
        }
    </style>
</head>
<body>
<header>
    <a th:href="@{/}">← Developer Issue Tracker</a>
</header>

<main>
    <h1 th:text="${issue.id == null ? 'Create an Issue' : 'Edit Issue'}">
        Create an Issue
    </h1>
    <p class="muted">Record a bug or task and keep development work organised.</p>

    <section class="panel">
        <form th:object="${issue}" th:action="${issue.id == null ? '/issues' : '/issues/' + issue.id}" method="post">

            <div class="field">
                <label for="title">Issue title *</label>
                <input id="title" type="text" th:field="*{title}"
                       maxlength="120" required
                       placeholder="e.g. Login button does not respond">
                <div class="error" th:errors="*{title}"></div>
            </div>

            <div class="field">
                <label for="description">Description *</label>
                <textarea id="description" th:field="*{description}"
                          maxlength="2000" required
                          placeholder="Describe the bug or task, including steps to reproduce if relevant."></textarea>
                <div class="error" th:errors="*{description}"></div>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="priority">Priority *</label>
                    <select id="priority" th:field="*{priority}" required>
                        <option th:each="priorityOption : ${priorities}"
                                th:value="${priorityOption}"
                                th:text="${priorityOption}">
                        </option>
                    </select>
                    <div class="error" th:errors="*{priority}"></div>
                </div>

                <div class="field">
                    <label for="status">Status *</label>
                    <select id="status" th:field="*{status}" required>
                        <option th:each="statusOption : ${statuses}"
                                th:value="${statusOption}"
                                th:text="${statusOption}">
                        </option>
                    </select>
                    <div class="error" th:errors="*{status}"></div>
                </div>
            </div>

            <div class="field">
                <label for="assignee">Assignee</label>
                <input id="assignee" type="text" th:field="*{assignee}"
                       maxlength="100" placeholder="Developer name (optional)">
                <div class="error" th:errors="*{assignee}"></div>
                <div class="help">Leave blank if nobody has been assigned yet.</div>
            </div>

            <div class="actions">
                <button class="button primary" type="submit">Save Issue</button>
                <a class="button secondary" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </section>
</main>

<footer>Developer Issue Tracker · Java · Spring Boot · PostgreSQL</footer>
</body>
</html>
