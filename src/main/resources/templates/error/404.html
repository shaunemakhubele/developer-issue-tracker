<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Issue Not Found | Developer Issue Tracker</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fa; color: #202938; }
        main { max-width: 650px; margin: 90px auto; padding: 32px; text-align: center; }
        section { background: white; padding: 40px 24px; border: 1px solid #e5e7eb; border-radius: 12px; }
        h1 { font-size: 52px; margin: 0 0 12px; }
        p { color: #667085; line-height: 1.6; }
        a { display: inline-block; margin-top: 15px; padding: 12px 18px; border-radius: 7px; background: #4f46e5; color: white; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<main>
    <section>
        <h1>404</h1>
        <h2>Issue not found</h2>
        <p th:text="${message}">The requested issue could not be found.</p>
        <a th:href="@{/}">Back to dashboard</a>
    </section>
</main>
</body>
</html>
